# The course pitch and its three components. Same for every term.
# Each component has its own page at /<id>/; `summary` is the short form used
# in search results and links, and `detail` opens the component's own page.
# The promise at the top of the home page, as one short sentence.
headline: Build a generative AI product in one semester.
# A short paragraph under the headline: what the course is, for readers and search.
blurb: >-
  The capstone course of the USC Artificial Intelligence Minor, connecting
  technical foundations, industry analysis and hands-on AI product development.
components:
  - id: curriculum
    title: Technical foundations
    timing: Throughout the semester
    promise: Learn how frontier models work.
    # Semester weeks this part spans; the home page puts its stop at `from`.
    weeks: { from: 1, to: 15 }
    summary: >-
      How generative AI works and how frontier models are built, adapted and
      evaluated: transformers and attention, prompting, retrieval, fine-tuning
      with LoRA, alignment and RLHF, evaluation and AI safety.
    detail: >-
      Students explore how generative AI works and how frontier models are
      built, adapted and evaluated. Topics include transformers and attention,
      prompting, retrieval-augmented generation, efficient fine-tuning with LoRA
      and QLoRA, alignment, RLHF and PPO, model evaluation and benchmarks, and
      AI safety. Hands-on work connects these concepts to conversational AI,
      text generation and summarization, machine translation and multimodal
      applications.
  - id: company-overview
    title: AI company overview
    timing: Midsemester
    promise: Study the companies building on them.
    weeks: { from: 5, to: 8 }
    summary: >-
      Teams study an emerging AI company backed by Y Combinator or a leading
      venture firm, analyzing its product, technology, customers and market,
      then present it with a concrete generative AI use case.
    detail: >-
      The company overview connects the technical material with the products and
      businesses being built around generative AI. Teams investigate an emerging
      company, explain why its technology matters, and use that analysis to
      inform their own product ideas.
    steps:
      - title: Select an emerging company
        text: >-
          Teams of six, four of which may have seven, choose a company at the
          pre-seed, seed, Series A or Series B stage with an emerging generative
          AI application. Y Combinator companies are preferred; other choices
          need the professor's approval. Every team discusses its choice with
          the professor before preparing the overview.
      - title: Explain the product and technology
        text: >-
          Cover the problem, product, generative AI technology, target
          customers, use case, differentiation and market opportunity, with one
          or two concrete examples that show how the product works and what
          makes it distinctive.
      - title: Present and connect to your product
        text: >-
          Every member presents in a ten-minute overview with a two-minute Q&A,
          then pitches the team's own product ideas in one slide and one minute
          each. Teams are encouraged to reach a founder, executive or employee;
          a 15–20 minute guest segment is optional if the company takes part.
  - id: capstone
    title: AI capstone product
    timing: Final nine weeks
    promise: Ship an AI product of your own.
    weeks: { from: 8, to: 16 }
    summary: >-
      Teams take a product from idea to a shared MVP, through multiple
      prototypes, to a complete application built on frontier-model APIs, ending
      in a live demo and a startup-style launch pitch.
    detail: >-
      Over nine weeks, the same team moves from a user problem and product idea
      to one shared minimum viable product, develops multiple prototypes, and
      selects one direction to refine into a complete application. Every product
      uses a frontier-model API for at least one feature, and students
      progressively build with AI coding tools such as Codex, Claude or Muse
      Code.
    # One step per week of `weeks`; the site numbers them Week 8, Week 9….
    steps:
      - title: Form teams
        text: >-
          Teams of six or seven, the same teams as the company overview, meet
          with the professor to start.
      - title: Propose product ideas
        text: >-
          Develop product ideas grounded in class concepts and a clear user
          problem, and weigh the value each could offer.
      - title: Prepare idea pitches
        text: >-
          Prepare one slide and a one-minute pitch for each idea, presented
          after the company overview.
      - title: Pitch and plan the roadmap
        text: >-
          Pitch each idea, then define the product roadmap and the scope of one
          shared MVP with a learning assistant.
      - title: Build one shared MVP
        text: >-
          Use course code and class concepts to build one minimum viable
          product, establishing the core experience and technical foundation.
      - title: Start multiple prototypes
        text: >-
          Improve the MVP and explore alternative directions through prototypes
          that add a frontier-model API feature.
      - title: Develop the prototypes
        text: >-
          Build prototypes in groups of two or three, comparing different
          implementations before choosing a direction.
      - title: Select and refine
        text: >-
          Choose a prototype and bring the team's work together into one
          complete application, ready to demonstrate.
      - title: Demo and launch pitch
        text: >-
          Demonstrate the product in a startup-style pitch connecting the user
          problem, product value, business opportunity and technical
          architecture, from the MVP through prototypes to the final product.
