title: Product Recommendation Chatbot
term: spring-2024
summary:
  A chatbot that recommends, explains, and compares consumer electronics using
  cosine-similarity matching and GPT-generated explanations.
description:
  The Product Recommendation Chatbot simplifies consumer tech purchases by
  delivering personalized product recommendations, explanations, and
  comparisons, reducing decision-making complexity and enhancing user shopping
  experience across multiple electronic categories.
built:
  Collect product data via APIs, deploy cosine similarity algorithms for product
  matching, integrate GPT-generated recommendation explanations, monetize
  through subscriptions and affiliate partnerships, and expand product
  categories regularly.
team:
