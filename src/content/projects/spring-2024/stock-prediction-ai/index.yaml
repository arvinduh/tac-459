title: Stock Prediction AI
term: spring-2024
summary:
  Sentiment analysis of financial news with a fine-tuned Mistral-7B model to
  predict short-term stock movements.
description:
  Stock Prediction AI utilizes NLP and advanced sentiment analysis on financial
  news and market headlines, accurately predicting short-term stock movements to
  help investors make data-driven trading and investment decisions.
built:
  Gather financial data, preprocess news content, fine-tune NLP models
  (Mistral-7B), deploy visual dashboards for insights, implement subscription
  monetization, and enforce stringent data privacy and cybersecurity measures.
