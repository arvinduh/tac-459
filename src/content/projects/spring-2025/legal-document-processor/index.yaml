title: Legal Document Processor
term: spring-2025
summary:
  Summarizes legal PDFs extractively (BERT with MMR) or abstractively (T5), with
  optional legal entity extraction.
description:
  An AI-powered legal document summarizer aimed at corporate law firms, legal
  aid clinics, and government agencies that need to quickly digest long PDFs.
  Users upload a contract, brief, or judgment and choose between an extractive
  or abstractive summary, with optional named-entity extraction for legally
  relevant entities.
built:
  "Extracts text from PDFs with PyMuPDF, then offers two summarization paths: an
  extractive pipeline that embeds sentences with BERT and selects them via
  Maximal Marginal Relevance (MMR) to balance relevance against redundancy, and
  an abstractive pipeline using Google's T5-small for paraphrased summaries.
  spaCy (en_core_web_sm) handles legal NER, and Gradio provides the interactive
  web UI."
