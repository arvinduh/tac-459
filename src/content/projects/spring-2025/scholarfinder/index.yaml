title: 'ScholarFinder: Smart Research Paper Finder'
term: spring-2025
summary:
  Semantic search over arXiv papers with similarity scores, LLM summaries, and
  related-paper recommendations.
description:
  A semantic research-paper search tool that goes beyond keyword matching,
  letting students, researchers, and educators query an indexed corpus of arXiv
  papers with interpretable similarity scores, LLM-generated summaries, and
  recommendations for related work.
built:
  Indexes papers fetched from the arXiv API, embeds titles and abstracts with
  OpenAI embeddings, and stores them in Pinecone for cosine-similarity
  retrieval. A FastAPI backend serves a Streamlit frontend, with PyMuPDF and
  chunked GPT-3.5-Turbo calls for full-paper summarization and Levenshtein-based
  fuzzy matching for author and journal filters.
