title: 'FEND.AI: Unreal News Detection Platform'
term: spring-2025
summary:
  A fact-checker that scores the credibility of news articles and explains why
  content was flagged as real or fake.
description:
  An AI-powered fact-checking tool that helps everyday users instantly assess
  the credibility of digital news articles, returning a confidence score along
  with a human-readable explanation of why a piece of content was flagged as
  real or fake.
built:
  Combines a live web-search RAG pipeline (NLTK RAKE keyword extraction, the
  SERP Google Search API, and GPT-3.5-Turbo for verification) with classical ML
  baselines (TF-IDF + Logistic Regression, TF-IDF + XGBoost, and a Bi-LSTM with
  LIME for interpretability), all served through a Streamlit interface.
team:
