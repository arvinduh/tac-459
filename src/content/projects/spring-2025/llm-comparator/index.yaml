title: LLM Comparator
term: spring-2025
summary:
  Runs one prompt across GPT-4o, Claude, Gemini, Llama, and other LLMs side by
  side, with voting and blind comparisons.
description:
  A side-by-side comparison tool that runs the same prompt across multiple
  frontier LLMs — GPT-4o, Claude 3.7 Sonnet, Gemini 2.5, Llama 4, Mistral,
  DeepSeek, and Grok — and lets users upvote responses, run anonymous blind
  comparisons, and manage their own API keys for each provider.
built:
  Built as a Streamlit app with consolidated chat-completion endpoints across
  OpenAI, Anthropic, and OpenRouter, streaming responses with tiktoken-based
  token accounting, prompt-keyed response caching, and an APIKeyManager that
  loads credentials from a .env file or per-session state.
