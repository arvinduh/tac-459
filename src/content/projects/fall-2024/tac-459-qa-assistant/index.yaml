title: QA AI Assistant for TAC 459
term: fall-2024
summary:
  A RAG assistant that answers TAC 459 course questions from lecture materials
  with cited answers.
description:
  A Retrieval-Augmented Generation (RAG)-based assistant designed for answering
  course-related queries using lecture materials. It enhances learning through
  real-time, course-specific answers.
built:
  It uses a vector database and LLMs to retrieve relevant course materials,
  allowing students to receive precise, cited answers with minimal instructor
  intervention.
