title: AI-Based Career Advisor
term: fall-2024
summary:
  A career advisor that matches skills to jobs with GPT-4o and cosine
  similarity, pulling live listings through Bing and LinkedIn APIs.
description:
  This AI-powered career advisor provides personalized job recommendations based
  on skill analysis and real-time job market insights. It integrates with Bing
  and LinkedIn APIs for real-time job search.
built:
  The system uses GPT-4o for skill matching, cosine similarity, and real-time
  job updates, ensuring accurate and up-to-date recommendations.
